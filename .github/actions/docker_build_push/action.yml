name: Docker Build and Push
description: Build and push a Docker image to Docker Hub

inputs:
    image_name:
        description: Docker Hub image name (e.g. base, datascience, jupyterhub-datascience)
        required: true
    dockerfile:
        description: Path to the Dockerfile
        required: true
    tag_name:
        description: Release tag name (empty string on non-release triggers)
        required: false
        default: ''
    use_cache:
        description: Use Docker layer cache
        required: false
        default: 'true'
    push:
        description: Push image to Docker Hub
        required: false
        default: 'true'
    tag_suffix:
        description: Appended to every tag (-arm64 for the arm64 builds)
        required: false
        default: ''
    cache_name:
        description: Image name of the registry layer cache (default the job id)
        required: false
        default: ''
    build_args:
        description: Newline-separated build arguments
        required: false
        default: ''

runs:
    using: composite
    steps:
        - name: login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ env.DOCKERHUB_USERNAME }}
            password: ${{ env.DOCKERHUB_TOKEN }}
        - name: set up docker buildx
          uses: docker/setup-buildx-action@v4
          with:
            # Self-hosted: dockerd's own BuildKit, so images land in the runner's store and the layer
            # cache persists. Its registry cache export needs the containerd store hosted may lack.
            driver: ${{ runner.environment == 'self-hosted' && 'docker' || 'docker-container' }}
        - name: determine tags
          id: tags
          shell: bash
          env:
            IMAGE: ${{ inputs.image_name }}
            TAG: ${{ inputs.tag_name }}
            SUFFIX: ${{ inputs.tag_suffix }}
          run: |
            TAGS="brineylab/${IMAGE}:latest${SUFFIX}"
            if [ -n "$TAG" ]; then
              TAGS="${TAGS}
            brineylab/${IMAGE}:${TAG}${SUFFIX}"
            fi
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$TAGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
        - name: build and push
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ${{ inputs.dockerfile }}
            no-cache: ${{ inputs.use_cache != 'true' }}
            cache-to: type=registry,ref=brineylab/${{ inputs.cache_name || github.job }}:cache,compression=zstd,mode=max,ignore-error=true
            cache-from: type=registry,ref=brineylab/${{ inputs.cache_name || github.job }}:cache,compression=zstd
            provenance: false
            build-args: ${{ inputs.build_args }}
            push: ${{ inputs.push == 'true' }}
            tags: ${{ steps.tags.outputs.tags }}
