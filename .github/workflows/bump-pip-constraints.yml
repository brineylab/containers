name: bump pip constraints

on:
    schedule:
        - cron: '0 14 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: bump-pip-constraints

jobs:
    bump:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
            - name: set up uv
              uses: astral-sh/setup-uv@v10.3.3
            - name: re-resolve with upgrades
              run: |
                cp requirements/constraints.txt "$RUNNER_TEMP/old.txt"
                requirements/compile-constraints.sh --upgrade
            - name: open or refresh the bump PR
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: deps/pip-constraints
              run: |
                if git diff --quiet requirements/constraints.txt; then
                  echo "no pin changed"; exit 0
                fi
                python3 - "$RUNNER_TEMP/old.txt" requirements/constraints.txt > "$RUNNER_TEMP/body.md" <<'EOF'
                import re, sys
                def pins(path):
                    out = {}
                    for line in open(path):
                        m = re.match(r"([A-Za-z0-9_.-]+)\s*(?:==\s*(\S+)|@\s*(\S+))", line)
                        if m:
                            out[m[1].lower()] = m[2] or m[3]
                    return out
                old, new = pins(sys.argv[1]), pins(sys.argv[2])
                rows = [f"| `{n}` | {old.get(n, 'new')} | {new.get(n, 'removed')} |"
                        for n in sorted(old.keys() | new.keys()) if old.get(n) != new.get(n)]
                print("`requirements/compile-constraints.sh --upgrade`, run by `bump-pip-constraints.yml`.\n")
                print("Before merging, dispatch `docker-publish.yml` on this branch with `push=false` and read the test job.\n")
                print("| package | from | to |\n|---|---|---|")
                print("\n".join(rows))
                EOF
                git config user.name 'github-actions[bot]'
                git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git switch -c "$BRANCH"
                git commit -qam 'build(requirements): bump pip constraints'
                git push -f origin "$BRANCH"
                if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
                  gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
                else
                  gh pr create --head "$BRANCH" --title 'build(requirements): bump pip constraints' --body-file "$RUNNER_TEMP/body.md"
                fi
