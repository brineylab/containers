name: build and push BrineyLab Docker images

# Releases arrive through release.yml, which dispatches this from main: the legolas runner group admits only this
# workflow on main, and a release's own tag ref cannot be listed before it exists.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to build and publish alongside latest (empty builds main as latest only)
                type: string
                default: ''
            use_cache:
                description: Use Docker layer cache
                type: boolean
                default: true
            push:
                description: Push image to Docker Hub
                type: boolean
                default: true
            hosted:
                description: Build on GitHub-hosted runners instead of legolas
                type: boolean
                default: false

concurrency:
    group: docker-publish
    cancel-in-progress: true

permissions:
    contents: read

env:
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    # legolas's CI registry (ansible roles/actions_runner): how deeplearning's build reaches flint's GPU.
    CI_REGISTRY: 172.29.180.191:5001

jobs:
    # base
    base:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: build and push
              uses: ./.github/actions/docker_build_push
              with:
                image_name: base
                dockerfile: ./images/base/Dockerfile
                tag_name: ${{ inputs.tag }}
                use_cache: ${{ inputs.use_cache }}
                push: ${{ inputs.push && inputs.hosted }}

    # datascience
    datascience:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: build and push
              uses: ./.github/actions/docker_build_push
              with:
                image_name: datascience
                dockerfile: ./images/datascience/Dockerfile
                tag_name: ${{ inputs.tag }}
                use_cache: ${{ inputs.use_cache }}
                push: ${{ inputs.push && inputs.hosted }}

    # deeplearning
    deeplearning:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: build and push
              uses: ./.github/actions/docker_build_push
              with:
                image_name: deeplearning
                dockerfile: ./images/deeplearning/Dockerfile
                tag_name: ${{ inputs.tag }}
                use_cache: ${{ inputs.use_cache }}
                push: ${{ inputs.push && inputs.hosted }}
                # 8 measured at a 115 GiB peak in legolas's 160 GiB containers slice.
                build_args: FLASH_ATTN_MAX_JOBS=${{ runner.environment == 'self-hosted' && '8' || '2' }}
            - name: hand the image to the GPU tests
              if: runner.environment == 'self-hosted'
              env:
                TAG: ${{ inputs.tag || 'latest' }}
              run: |
                docker tag "brineylab/deeplearning:$TAG" "$CI_REGISTRY/deeplearning:ci"
                docker push -q "$CI_REGISTRY/deeplearning:ci"

    # jupyterhub-base depends on base (adds JupyterLab/Hub)
    jupyterhub-base:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        needs: [base]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: build and push
              uses: ./.github/actions/docker_build_push
              with:
                image_name: jupyterhub-base
                dockerfile: ./images/jupyterhub-base/Dockerfile
                tag_name: ${{ inputs.tag }}
                use_cache: ${{ inputs.use_cache }}
                push: ${{ inputs.push && inputs.hosted }}

    # jupyterhub-datascience depends on datascience (adds JupyterLab/Hub)
    jupyterhub-datascience:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        needs: [datascience]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: build and push
              uses: ./.github/actions/docker_build_push
              with:
                image_name: jupyterhub-datascience
                dockerfile: ./images/jupyterhub-datascience/Dockerfile
                tag_name: ${{ inputs.tag }}
                use_cache: ${{ inputs.use_cache }}
                push: ${{ inputs.push && inputs.hosted }}

    # jupyterhub-deeplearning depends on deeplearning (adds JupyterLab/Hub)
    jupyterhub-deeplearning:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        needs: [deeplearning]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: build and push
              uses: ./.github/actions/docker_build_push
              with:
                image_name: jupyterhub-deeplearning
                dockerfile: ./images/jupyterhub-deeplearning/Dockerfile
                tag_name: ${{ inputs.tag }}
                use_cache: ${{ inputs.use_cache }}
                push: ${{ inputs.push && inputs.hosted }}

    # GPU tests on flint, against the image deeplearning just built
    gpu-test:
        if: ${{ !inputs.hosted }}
        runs-on: [self-hosted, flint, gpu]
        needs: [deeplearning]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: set up uv
              uses: astral-sh/setup-uv@v10.3.3
            - name: pull the image deeplearning built
              env:
                TAG: ${{ inputs.tag || 'latest' }}
              run: |
                docker pull -q "$CI_REGISTRY/deeplearning:ci"
                docker tag "$CI_REGISTRY/deeplearning:ci" "brineylab/deeplearning:$TAG"
            - name: run GPU tests
              env:
                TAG: ${{ inputs.tag || 'latest' }}
              run: uvx --python 3.12 pytest tests/test_deeplearning.py -m gpu --require-gpu -v --tag="$TAG"

    # Each image family is tested as soon as its jupyterhub image is built.
    test-base:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        needs: [jupyterhub-base]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: test
              uses: ./.github/actions/run_tests
              with:
                images: base,jupyterhub-base
                tag: ${{ inputs.tag }}

    test-datascience:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        needs: [jupyterhub-datascience]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: test
              uses: ./.github/actions/run_tests
              with:
                images: datascience,jupyterhub-datascience
                tag: ${{ inputs.tag }}

    test-deeplearning:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        needs: [jupyterhub-deeplearning]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: test
              uses: ./.github/actions/run_tests
              with:
                images: deeplearning,jupyterhub-deeplearning
                tag: ${{ inputs.tag }}

    # The one check that spans families: shared packages match across datascience and deeplearning.
    test-cross:
        runs-on: ${{ inputs.hosted && 'ubuntu-latest-brineylab-xlarge' || fromJSON('["self-hosted","legolas","containers"]') }}
        needs: [datascience, deeplearning]
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 1
                ref: ${{ inputs.tag || github.ref }}
            - name: test
              uses: ./.github/actions/run_tests
              with:
                images: datascience,deeplearning
                tests: tests/test_base.py::TestVersionConsistency
                tag: ${{ inputs.tag }}

    # On legolas the builds push nothing, so an image reaches Docker Hub only once every test passed. Hosted
    # jobs share no engine, so there the builds push as before and the tests run after.
    publish:
        if: ${{ inputs.push && !inputs.hosted }}
        runs-on: [self-hosted, legolas, containers]
        needs: [test-base, test-datascience, test-deeplearning, test-cross, gpu-test]
        steps:
            - name: login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ env.DOCKERHUB_USERNAME }}
                password: ${{ env.DOCKERHUB_TOKEN }}
            - name: push the tested images
              env:
                TAG: ${{ inputs.tag }}
              run: |
                [[ -z "$TAG" || "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::not a Docker tag: $TAG"; exit 1; }
                for image in base datascience deeplearning jupyterhub-base jupyterhub-datascience jupyterhub-deeplearning; do
                  docker push -q "brineylab/$image:latest"
                  [ -z "$TAG" ] || docker push -q "brineylab/$image:$TAG"
                done
